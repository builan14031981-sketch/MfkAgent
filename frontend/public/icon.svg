<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="c2Base" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" /><stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="c2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="c2CoreShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- macOS 超椭圆底座 -->
  <path d="M 256 32 C 380 32 452 40 480 68 C 508 96 500 168 500 256 C 500 344 508 416 480 444 C 452 472 380 480 256 480 C 132 480 60 472 32 444 C 4 416 12 344 12 256 C 12 168 4 96 32 68 C 60 40 132 32 256 32 Z"
        fill="url(#c2Base)" stroke="#CBD5E1" stroke-width="2" filter="url(#c2Shadow)" />

  <!-- 内部悬浮核心 (Inner Slate Core) -->
  <g filter="url(#c2CoreShadow)">
    <polygon points="256,190 316,225 256,260 196,225" fill="#334155" />
    <polygon points="196,225 256,260 256,320 196,285" fill="#1E293B" />
    <polygon points="256,260 316,225 316,285 256,320" fill="#0F172A" />
    <line x1="256" y1="260" x2="256" y2="320" stroke="#475569" stroke-width="1.5" />
  </g>

  <!-- 外层高透磨砂晶体框 (Outer Glass Box) -->
  <g>
    <polygon points="256,130 366,194 256,258 146,194" fill="#FFFFFF" fill-opacity="0.4" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2" />
    <polygon points="146,194 256,258 256,382 146,318" fill="#64748B" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" />
    <polygon points="256,258 366,194 366,318 256,382" fill="#334155" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" />
    <line x1="256" y1="258" x2="256" y2="382" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2" />
  </g>
</svg>
