<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
      <linearGradient id="sm3" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#f97316"/><stop offset="50%" stop-color="#ef4444"/><stop offset="100%" stop-color="#ec4899"/>
      </linearGradient>
    </defs>
    <rect width="512" height="512" rx="112" fill="#1a0a0a"/>
